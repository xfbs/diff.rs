name: Continuous Integration

# run for pull requests and pushes to master branch
on:
  push:
    branches:
      - 'master'
  pull_request:

# always use pretty colors
env:
  CARGO_TERM_COLOR: always

jobs:
  # check formatting (use nightly rustfmt)
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # explicit +toolchain is needed, rust-toolchain.toml overrides `rustup default`
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --check

  # check style (using clippy)
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uses the toolchain from rust-toolchain.toml
      - run: cargo clippy -- --deny warnings

  # build and test code
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      # explicit +toolchain is needed, rust-toolchain.toml overrides `rustup default`
      - run: cargo +${{ matrix.toolchain }} build --verbose
      - run: cargo +${{ matrix.toolchain }} test --verbose
